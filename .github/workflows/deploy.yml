name: Publish portfolio and demos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: node scripts/install.mjs
      - name: Test API, n8n and SEO helpers
        run: npm test
      - name: Build all sites
        run: npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          PAGES_BASE: /astro-portfolio/
          PUBLIC_ASSISTANT_API_URL: ${{ vars.PUBLIC_ASSISTANT_API_URL }}
      - name: Check generated SEO and demo URLs
        run: npm run check:seo
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          PAGES_BASE: /astro-portfolio/
      - name: Check public forms, fonts and storage baseline
        run: npm run check:public
      - name: Check legal pages and shared footer links
        run: npm run check:legal
      - name: Check registered media and bundled licence notices
        run: npm run check:media
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
