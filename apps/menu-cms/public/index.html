<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/preview/assets/food.svg"><title>HIRDA · Меню CMS</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" type="module"></script></head><body>
<header><div><span class="brand">[H]IRDA <small>Menu CMS</small></span><p>Категории и продукты · Street Food</p></div><a class="button secondary" href="/preview/" target="_blank" rel="noopener">Открыть предпросмотр</a></header>
<main><div class="notice"><strong>Локальная CMS</strong><span>Изменения сохраняются в SQLite на этом компьютере. Публичное меню не меняется.</span></div><div id="status" role="status" aria-live="polite">Загрузка меню…</div>
<div class="workspace"><aside class="categories"><div class="section-head"><h1>Категории</h1><button id="new-category" class="small" disabled>Добавить</button></div><nav id="categories" aria-label="Категории меню"></nav><button id="edit-category" class="secondary full" hidden>Изменить категорию</button><p class="hint">«Все» и «Избранное» создаются в меню автоматически.</p></aside>
<section class="products"><div class="section-head"><div><p class="eyebrow">Каталог меню</p><h2 id="products-title">Все продукты</h2><p id="count" class="muted"></p></div><button id="new-product" disabled>Добавить продукт</button></div><label class="search">Поиск продуктов<input id="search" type="search" placeholder="Название или описание"></label><div id="products" class="product-list"></div><footer><span id="revision"></span><button id="reload" class="secondary small">Обновить данные</button></footer></section></div></main>
<dialog id="editor" aria-labelledby="editor-title"><div class="editor-head"><h2 id="editor-title"></h2><button id="close-editor" class="secondary small" aria-label="Закрыть редактор">Закрыть</button></div><form id="edit-form"><div id="fields"></div><p id="form-status" role="status" aria-live="polite"></p><div class="editor-actions"><button type="submit">Сохранить</button></div></form></dialog>
</body></html>
